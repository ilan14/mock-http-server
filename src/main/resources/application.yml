server:
  port: 8081

spring:
  application:
    name: mock-http-server
  main:
    web-application-type: servlet
  task:
    execution:
      # 定时器也实现 Executor；强制保留独立的应用发送执行器。
      mode: force
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
      thread-name-prefix: mock-stream-

mock:
  # 请求总生命周期上限；应大于 ai-gateway 的上游超时。
  stream-timeout-ms: 300000

# 与业务接口共用 server.port，不设置 management.server.port。
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
